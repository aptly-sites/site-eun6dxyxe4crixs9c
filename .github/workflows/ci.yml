name: Website CI

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]

jobs:
  build:
    name: Build and prerender website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workspace/et-website-v1 run build:vercel
        env:
          BASE_PATH: /
      - run: pnpm --filter @workspace/et-website-v1 test:rentals
      - run: pnpm --filter @workspace/et-website-v1 test:rentals:render
