kind = "web"
previewPath = "/v1/"
title = "EquityTeam Phase 1 Clone"
version = "1.0.0"
id = "artifacts/et-website-v1"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/v1/" ]
localPort = 19457

[services.development]
run = "pnpm --filter @workspace/et-website-v1 run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/et-website-v1", "run", "build" ]
publicDir = "artifacts/et-website-v1/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19457"
BASE_PATH = "/v1/"
